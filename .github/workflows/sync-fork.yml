name: Upstream Sync

on:
  schedule:
    # 每天 UTC 时间 0 点运行一次，可按需修改
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo
    # 仅在 Fork 仓库中运行
    if: github.event.repository.fork
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false # 关闭凭证持久化，安全性更高

      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_sync_branch: main # 你的 Fork 仓库的目标分支
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # 使用自动令牌
          upstream_sync_repo: PAICNI/CFNext # ⚠️ 必须修改为上游仓库
          upstream_sync_branch: main # 上游仓库的分支
